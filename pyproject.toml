[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palveron-openai-agents"
version = "1.1.0"
description = "Official Palveron integration for the OpenAI Agents SDK — drop-in middleware for policy enforcement, PII masking, and audit trails."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Palveron", email = "hello@palveron.com" }]
keywords = [
    "palveron",
    "openai",
    "openai-agents",
    "ai-governance",
    "guardrails",
    "eu-ai-act",
    "compliance",
    "audit-trail",
    "pii-detection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "palveron-sdk>=1.1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.5", "build"]

[project.urls]
Homepage = "https://palveron.com"
Documentation = "https://docs.palveron.com/sdks"
Repository = "https://github.com/palveron/adapter-openai-agents"
Issues = "https://github.com/palveron/adapter-openai-agents/issues"
Changelog = "https://github.com/palveron/adapter-openai-agents/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["palveron_openai_agents"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.mypy]
strict = true
python_version = "3.8"
