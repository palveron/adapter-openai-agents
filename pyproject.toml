[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vexis-openai-agents"
version = "0.1.0"
description = "VEXIS AI Governance adapter for the OpenAI Agents SDK — input/output guardrails with audit trails"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "VEXIS", email = "sdk@vexis.io" }]
keywords = ["vexis", "openai", "agents", "ai-governance", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "vexis-sdk>=0.5.0",
    "openai-agents>=0.1.0",
]

[project.urls]
Homepage = "https://vexis.io"
Documentation = "https://docs.vexis.io/integrations/openai-agents"
Repository = "https://github.com/disruptivetrends/vexis-openai-agents"

[tool.hatch.build.targets.wheel]
packages = ["vexis_openai_agents"]
